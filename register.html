<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register · CampusConnect</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body class="auth"><main class="auth-card">
  <h1>CampusConnect</h1><p class="tagline">Create your student moderator account</p>
  <form novalidate>
    <label for="firstName">First name</label><input id="firstName" name="firstName" required autocomplete="given-name">
    <label for="lastName">Last name</label><input id="lastName" name="lastName" required autocomplete="family-name">
    <label for="email">Institutional Email</label><input id="email" name="email" type="email" required autocomplete="username">
    <label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="new-password">
    <label for="confirm">Confirm password</label><input id="confirm" name="confirm" type="password" required autocomplete="new-password">
    <p id="msg" class="msg" role="alert"></p>
    <button class="btn" type="submit">Register</button>
  </form>
  <p class="alt">Already registered? <a href="login.html">Log in</a></p>
</main>
<script type="module">
  import { UserModel } from './js/models/UserModel.js';
  import { AuthView } from './js/views/AuthView.js';
  import { RegisterController } from './js/controllers/RegisterController.js';
  new RegisterController(new UserModel(), new AuthView());
</script></body></html>
