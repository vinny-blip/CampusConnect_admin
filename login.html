<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login · CampusConnect</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body class="auth"><main class="auth-card">
  <img class="logo" src="campusLogo.png" alt="">
  <img class="logo" src="ccName.png" alt="CampusConnect">
  <p class="tagline">Connect, Share, and Learn Together</p>
  <form novalidate>
    <label for="email">Institutional Email</label><input id="email" name="email" type="email" required autocomplete="username">
    <label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password">
    <p id="msg" class="msg" role="alert"></p>
    <button class="btn" type="submit">Login</button>
  </form>
  <p class="alt">New moderator? <a href="register.html">Create an account</a></p>

</main>
<script type="module">
  import { UserModel } from './js/models/UserModel.js';
  import { AuthView } from './js/views/AuthView.js';
  import { LoginController } from './js/controllers/LoginController.js';
  new LoginController(new UserModel(), new AuthView());
</script></body></html>
